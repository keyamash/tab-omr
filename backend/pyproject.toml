[project]
name = "tab-omr-backend"
version = "0.1.0"
description = "Guitar staff and TAB image to MusicXML converter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=2.1,<3",
  "Pillow>=11,<12",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

